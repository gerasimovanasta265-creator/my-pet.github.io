:root{--or:#E8702A;--or2:#cf5f1d;--pk:#F0B8C2;--pk2:#F8DDE2;--yl:#F3C97A;--li:#C7A6F2;--bk:#1b1614;--wh:#fff;--mu:#6d5d58;--er:#c0392b}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:"Segoe UI",Roboto,Arial,sans-serif;background:var(--pk);color:var(--bk);display:flex;justify-content:center;align-items:center;padding:24px}
.side{display:none;width:300px;flex:none}body.menu .side{display:block}#mb{position:fixed;top:14px;left:14px;border:0;border-radius:999px;background:var(--bk);color:#fff;padding:9px 16px;font-weight:700;font-size:13px;font-family:inherit;cursor:pointer;z-index:5}
.logo{font:900 30px/1 "Arial Black",Impact,sans-serif;text-transform:uppercase;color:var(--bk)}
.logo b{color:var(--or)}
.side p{margin:12px 0 22px;color:var(--mu);line-height:1.45}
.steps{list-style:none;padding:0;display:grid;gap:6px}
.steps button{width:100%;text-align:left;border:0;background:rgba(255,255,255,.5);padding:9px 14px;border-radius:12px;font:600 14px inherit;font-family:inherit;cursor:pointer;color:var(--bk)}
.steps button.on{background:var(--or);color:#fff}
.steps button:focus-visible,.btn:focus-visible,.ch:focus-visible{outline:3px solid var(--bk);outline-offset:2px}
.phone{width:400px;height:min(780px,calc(100vh - 48px));background:var(--wh);border-radius:36px;border:8px solid var(--bk);overflow:hidden;display:flex;flex-direction:column;position:relative;flex:none}
.scr{flex:1;overflow-y:auto;padding:22px 22px 16px;display:flex;flex-direction:column;gap:12px;animation:in .25s}
@keyframes in{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.scr{animation:none}}
h1{font:900 25px/1.1 "Arial Black",Impact,sans-serif;text-transform:uppercase;letter-spacing:-.3px}
h2{font:800 19px/1.2 "Arial Black",Impact,sans-serif}
.mu{color:var(--mu);font-size:14px;line-height:1.4}
.btn{border:0;border-radius:999px;padding:15px 20px;font:800 16px inherit;font-family:inherit;background:var(--or);color:#fff;cursor:pointer;width:100%;transition:background .15s}
.btn:hover{background:var(--or2)}
.btn.g{background:var(--pk2);color:var(--bk)}
.btn.g:hover{background:var(--pk)}
.btn[disabled]{background:#ddd;color:#888;cursor:not-allowed}
.sp{flex:1}
.hero{background:var(--or);border-radius:24px;padding:20px;color:#fff;position:relative;overflow:hidden}
.hero h1{font-size:28px}
.hero .big{font-size:64px;text-align:right;line-height:1}
.hero .pw{position:absolute;right:-18px;top:-18px;width:90px;height:90px;border-radius:50%;background:var(--pk)}
.hero>*{position:relative}
.list{display:grid;gap:8px;font-size:15px}
.list div{background:var(--pk2);border-radius:14px;padding:10px 14px}
.tip{background:var(--yl);border-radius:14px;padding:10px 14px;font-size:14px;font-weight:600}
.card{display:flex;gap:12px;align-items:center;border:2px solid var(--pk2);border-radius:18px;padding:12px}
.card.hl{border-color:var(--or);background:#fff6f0}
.card .av{font-size:30px;width:52px;height:52px;border-radius:50%;background:var(--pk2);display:grid;place-items:center;flex:none}
.card .t{flex:1;min-width:0}
.card .t small{display:block;color:var(--mu);font-size:13px;margin-top:2px}
.pct{font:900 15px "Arial Black",sans-serif;color:var(--or)}
.mini{border:0;border-radius:999px;padding:8px 14px;font:700 13px inherit;font-family:inherit;background:var(--bk);color:#fff;cursor:pointer}
.mini.done{background:var(--li);color:var(--bk);cursor:default}
label.f small{font-weight:400}
label.f{display:grid;gap:4px;font-size:13px;color:var(--mu);font-weight:600}
input,select,textarea{font:16px inherit;font-family:inherit;border:2px solid var(--pk);border-radius:14px;padding:12px 14px;width:100%;background:#fff;color:var(--bk)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--or)}
.bad input,.bad select{border-color:var(--er)}
.err{color:var(--er);font-size:13px;font-weight:600;min-height:0}
.ph{height:120px;border-radius:20px;background:var(--pk2);display:grid;place-items:center;font-size:44px;border:2px dashed var(--pk)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.ch{border:2px solid var(--pk);background:#fff;border-radius:999px;padding:10px 16px;font:600 15px inherit;font-family:inherit;cursor:pointer;color:var(--bk)}
.ch.on{background:var(--or);border-color:var(--or);color:#fff}
.bad .chips{outline:2px solid var(--er);outline-offset:6px;border-radius:14px}
.tag{display:inline-block;background:var(--li);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:700}
.bar{height:8px;background:var(--pk2);border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--or);transition:width .3s}
.more{background:none;border:0;color:var(--or);font:700 14px inherit;font-family:inherit;cursor:pointer;text-align:left;padding:0}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.chk input{width:22px;height:22px;accent-color:var(--or);flex:none;padding:0}
.chk u{cursor:pointer;color:var(--or)}
.row{display:flex;gap:8px}
.toast{position:absolute;left:16px;right:16px;bottom:16px;background:var(--bk);color:#fff;border-radius:16px;padding:14px 16px;font-size:14px;font-weight:600;animation:in .25s}
.nav{display:flex;align-items:center;gap:10px}
.back{border:0;background:var(--pk2);border-radius:50%;width:38px;height:38px;font-size:18px;cursor:pointer;flex:none}
.big2{font-size:70px;text-align:center}
.app{background:var(--pk2);border-radius:18px;padding:12px;display:flex;gap:10px;align-items:center}
.app.hl{outline:3px solid var(--or)}
@media (max-width:900px){
 body{padding:0;display:block;background:#fff}
 .side,#mb{display:none!important}
 .phone{width:100%;height:100dvh;border:0;border-radius:0}
}
</style>
</head>
<body>

<button id="mb">Список экранов</button>
<aside class="side">
 <div class="logo">Четыре <b>Лапы</b></div>
 <p>Перейдите к нужному экрану из списка или пройдите путь по кнопкам в приложении.</p>
 <ul class="steps" id="steps"></ul>
</aside>
<main class="phone" id="phone"><div class="scr" id="scr"></div></main>

<script>
const $=s=>document.querySelector(s);
const OTHER='Нет подходящего, напишу сам';
const D=['Центральный','Северный','Северо-Восточный','Восточный','Юго-Восточный','Южный','Юго-Западный','Западный','Северо-Западный'];
const METRO={'Центральный':['Чистые пруды','Новослободская','Китай-город','Парк культуры'],'Северный':['Аэропорт','Динамо','Войковская'],'Северо-Восточный':['ВДНХ','Алексеевская','Бабушкинская'],'Восточный':['Измайловская','Партизанская','Сокольники'],'Юго-Восточный':['Кузьминки','Текстильщики','Люблино'],'Южный':['Тульская','Коломенская','Нагатинская'],'Юго-Западный':['Беляево','Университет','Новые Черёмушки'],'Западный':['Кунцевская','Фили','Кутузовская'],'Северо-Западный':['Строгино','Щукинская','Планерная']};
const SIZE=['Мини, до 5 кг','Малый, 5–10 кг','Средний, 10–25 кг','Крупный, 25–40 кг','Очень крупный, от 40 кг'];
const BODY=['Лёгкое, худощавое','Среднее, пропорциональное','Плотное, коренастое','Массивное, тяжёлое'];
const BREEDS={'корги':[2,2],'лабрадор':[3,1],'овчарка':[3,1],'такса':[1,2],'чихуахуа':[0,0],'йорк':[0,0],'шпиц':[1,1],'бигль':[2,1],'мопс':[1,2],'бульдог':[1,3],'хаски':[3,1],'золотистый':[3,1],'джек':[1,1]};
const st={name:'Бублик',district:'Центральный',metro:'',nmetro:'',ans:{},note:{},q:0,sent:{},registered:false,code:'',phone:'+7 900 000-00-00',auto:''};
const NAV=[['promo','1. Анонс'],['reg','2. Регистрация'],['profile','3. Профиль питомца'],['quiz','4. Анкета'],['choose','5. Выбор'],['friends','6А. Друзья'],['near','6Б. Рядом'],['err','Ошибка загрузки']];

const Q=[
 {t:'Какого размера {n}?',o:SIZE,h2:'Какое у {n} телосложение?',o2:BODY},
 {t:'Какая у {n} энергия?',o:['Спокойный, любит полежать','Умеренный: и побегает, и отдохнёт','Активный, любит движение','Очень энергичный, не устаёт']},
 {t:'Как {n} относится к другим собакам?',o:['Дружелюбный ко всем','Дружелюбный, но знакомится не сразу','Осторожный, держит дистанцию','Не любит чужих собак','Зависит от собаки: размера, пола, характера','Не знаю, мало общались']},
 {t:'С кем {n} ладит лучше всего?',o:['С малыми собаками','Со средними','С крупными','С похожими по размеру','Только с щенками','Без разницы']},
 {t:'Как {n} играет?',o:['Мягко и аккуратно','Азартно, но без грубости','Азартно, может грубить','Любит догонялки','Любит борьбу и возню','Чаще сам по себе']},
 {t:'Бывали ли конфликты с другими собаками?',h:'Честный ответ поможет подобрать безопасную компанию.',o:['Никогда','Только рычал или лаял','Бывали стычки без травм','Были укусы','Не знаю, мало встречались']},
 {t:'Как {n} относится к людям и детям?',o:['Любит всех','Любит детей, осторожен со взрослыми','Осторожен с незнакомыми','Лучше не подходить']},
 {t:'Как {n} воспитан и знает ли команды?',o:['Знает базовые команды, слушается чётко','Знает, но выполняет по настроению','Учим, получается не всегда','Прошёл курс дрессировки','Команд почти не знает']},
 {t:'Как {n} ведёт себя на поводке и при подзыве?',o:['Идёт рядом спокойно','Тянет поводок','Гуляет без поводка и подзывается','Гуляет без поводка, но плохо подзывается','Гуляет только на коротком поводке или шлейке']},
 {t:'На что {n} реагирует сильно?',o:['Ни на что особенное','Только на других собак','На велосипеды и самокаты','На громкие звуки','На чужих людей','На еду и игрушки','На несколько вещей, напишу ниже']},
 {t:'Как {n} любит гулять?',o:['Бегать и играть','Спокойно нюхать и исследовать','Играть с мячом','Тренироваться','Долго гулять','Гулять недолго']},
 {t:'Когда вы обычно гуляете?',o:['Утром','Днём','Вечером','По-разному']},
 {t:'Что ещё важно знать о питомце?',free:1}
];
const PETS=[
 {n:'Луна',e:'🐩',e2:'Активный',d:'Дружелюбный',p:'Мягко',z:'Центральный',m:'Чистые пруды',s:'Лабрадор, 2 года'},
 {n:'Рекс',e:'🐕',e2:'Очень энергичный',d:'Осторожный',p:'Азартно',z:'Центральный',m:'Новослободская',s:'Овчарка, 4 года'},
 {n:'Мася',e:'🐶',e2:'Спокойный',d:'Дружелюбный',p:'Мягко',z:'Центральный',m:'Китай-город',s:'Шпиц, 5 лет'},
 {n:'Барни',e:'🦮',e2:'Активный',d:'Дружелюбный',p:'Азартно',z:'Южный',m:'Коломенская',s:'Бигль, 3 года'},
 {n:'Ласка',e:'🐕‍🦺',e2:'Умеренный',d:'Дружелюбный',p:'Мягко',z:'Южный',m:'Тульская',s:'Метис, 6 лет'},
 {n:'Альма',e:'🐩',e2:'Активный',d:'Дружелюбный',p:'Любит',z:'Юго-Западный',m:'Беляево',s:'Пудель, 3 года'}
];
const sw=(a,x)=>a&&a[0]&&a[0].startsWith(x)?1:0;
const pet=p=>{const a=st.ans;return 52+16*(sw(a[1],p.e2)+sw(a[2],p.d)+sw(a[4],p.p))+(st.nmetro&&p.m===st.nmetro?4:0)};
const mopts=(d,any)=>`<option value="">${any}</option>`+(METRO[d]||[]).map(m=>`<option ${m===st.metro?'selected':''}>${m}</option>`).join('');
const dopts=()=>D.map(d=>`<option ${d===st.district?'selected':''}>${d}</option>`).join('');

let cur='promo';
function go(id){cur=id;document.querySelectorAll('.steps button').forEach(b=>b.classList.toggle('on',b.dataset.id===id));
 const s=$('#scr');s.style.animation='none';s.offsetHeight;s.style.animation='';
 s.innerHTML=V[id]();bind();s.scrollTop=0}
const btn=(t,a,c='')=>`<button class="btn ${c}" data-a="${a}">${t}</button>`;
const back=a=>`<div class="nav"><button class="back" data-a="${a}" aria-label="Назад">←</button></div>`;
const toast=(t,ms=2800)=>{document.querySelectorAll('.toast').forEach(x=>x.remove());const e=document.createElement('div');e.className='toast';e.textContent=t;$('#phone').append(e);setTimeout(()=>e.remove(),ms)};

const V={
promo:()=>`
 <div class="hero"><span class="pw"></span><h1>Друзья для вашей собаки рядом с домом</h1></div>
 <p style="font-size:16px;line-height:1.45">Расскажите о характере питомца, и мы покажем собак из вашего района, с которыми ему будет комфортно гулять.</p>
 <div class="list"><div><b>1.</b> Заполните анкету, это 3–4 минуты</div><div><b>2.</b> Посмотрите подходящих питомцев по соседству</div><div><b>3.</b> Позовите на совместную прогулку</div></div>
 <div class="card hl"><div class="av">🐩</div><div class="t"><b>Луна · совпадение 92%</b><small>Тоже активная и дружелюбная. Гуляет у метро «Чистые пруды»</small></div></div>
 <div class="sp"></div>${btn('Заполнить анкету','tryit')}${btn('Не сейчас','think','g')}`,

think:()=>`<div class="sp"></div><div class="big2">🐾</div><h2 style="text-align:center">Хорошо, вернётесь позже</h2><p class="mu" style="text-align:center">Через несколько дней мы напомним о новой функции. Она будет ждать в разделе «Мой питомец».</p><div class="sp"></div>${btn('Вернуться к анонсу','promo')}`,

reg:()=>`${back('promo')}<h1>Регистрация</h1><p class="mu">Мы отправим SMS с кодом подтверждения.</p>
 <label class="f" id="fp">Телефон<input id="ph" inputmode="tel" value="${st.phone}"></label>
 <button class="btn g" data-a="sendcode">${st.code?'Отправить код ещё раз':'Получить код'}</button>
 <label class="f" id="fc">Код из SMS<input id="cd" inputmode="numeric" maxlength="4" placeholder="4 цифры" ${st.code?'':'disabled'}></label><div class="err" id="re"></div>
 <label class="chk"><input type="checkbox" id="ok"><span>Принимаю <u data-a="rules">правила сообщества</u></span></label>
 <div class="sp"></div><button class="btn" id="rb" data-a="doreg" disabled>Зарегистрироваться</button>`,

rules:()=>`${back('reg')}<h1>Правила знакомств</h1>
 <div class="list"><div>📍 Показываем район и метро, точный адрес не показываем</div><div>📝 Честная анкета, особенно про конфликты</div><div>🌳 Первая встреча в людном месте, лучше днём</div><div>🤝 Без оскорблений, рекламы и спама</div><div>🚫 Любого владельца можно заблокировать</div><div>🐕 Питомец всегда под контролем</div><div>👁 Скрыть профиль из поиска можно в любой момент</div></div>
 <div class="sp"></div>${btn('Принять и вернуться','acceptrules')}`,

profile:()=>`${back('reg')}<h1>Профиль питомца</h1><p class="mu">Данные из «Четыре Лапы» уже подставлены.</p>
 <div class="ph">📷</div>
 <label class="f">Кличка<input value="${st.name}" id="nm"></label>
 <div class="row"><label class="f" style="flex:1">Порода<input id="br" value="Корги"></label><label class="f" style="width:110px">Возраст<input value="3 года"></label></div>
 <label class="f" id="fd">Район Москвы<select id="ds">${dopts()}</select></label>
 <label class="f">Метро рядом (необязательно)<select id="mt">${mopts(st.district,'Не указывать')}</select></label>
 <div class="mu">Если район большой, укажите станцию: так проще найти соседей. Точный адрес не показываем.</div>
 <div class="chips"><span class="tag">Привит</span><span class="tag">Стерилизован</span><span class="tag">Чип есть</span></div>
 <div class="sp"></div><button class="btn" data-a="startquiz">Начать знакомства</button>`,

quiz:()=>{const q=Q[st.q],i=st.q,n=Q.length,nm=st.name;
 const grp=(o,k)=>`<div class="chips" data-k="${k}">${o.map(x=>`<button class="ch ${(st.ans[k]||[]).includes(x)?'on':''}">${x}</button>`).join('')}</div>`;
 const open=st.note[i]!==undefined||(st.ans[i]||[])[0]===OTHER;
 return `<div class="nav"><button class="back" data-a="qback" aria-label="Назад">←</button><div style="flex:1"><div class="mu">${i+1} из ${n} · ответы сохраняются</div><div class="bar"><i style="width:${(i+1)/n*100}%"></i></div></div></div>
 <h1 style="font-size:22px">${q.t.replace('{n}',nm)}</h1>
 ${q.free?`<textarea id="nt" rows="5" placeholder="Например: боится самокатов, лучше гулять без мячей">${st.note.free||''}</textarea>`:`
 <div id="g1">${grp([...q.o,OTHER],i)}</div>
 <div class="mu">${i===0&&st.auto?`Подобрали по породе «${st.auto}». Поправьте, если это не так.`:q.h||'Выберите один вариант'}</div>
 ${q.o2?`<h2 style="margin-top:6px">${q.h2.replace('{n}',nm)}</h2><div id="g2">${grp(q.o2,i+'b')}</div>`:''}
 <div class="err" id="qe"></div>
 <button class="more" data-a="more">${open?'− Скрыть':'+ Написать подробнее'}</button>
 <textarea id="nt" rows="3" placeholder="Расскажите своими словами" style="${open?'':'display:none'}">${st.note[i]||''}</textarea>`}
 <div class="sp"></div>${btn(i===n-1?'Сохранить анкету':'Дальше','qnext')}`},

choose:()=>`<div class="sp"></div><div class="big2">🎉</div><h1 style="text-align:center">${st.name} готов к знакомствам!</h1><p class="mu" style="text-align:center">Профиль и анкета сохранены. Что дальше?</p><div class="sp"></div>${btn('У меня уже есть друзья','friends','g')}${btn('Искать новых друзей','near')}`,

friends:()=>{const L=[['🐩','Луна','@luna_walks'],['🐕','Рекс','@rex_park']];
 return `${back('choose')}<h1>Друзья</h1><p class="mu">Найдите знакомых по нику или выберите из контактов.</p>
 <label class="f">Поиск по нику<input id="sq" placeholder="@ник"></label><div class="err" id="se"></div>
 <div id="fl" style="display:grid;gap:10px">${L.map(x=>`<div class="card"><div class="av">${x[0]}</div><div class="t"><b>${x[1]}</b><small>${x[2]}</small></div><button class="mini ${st.sent[x[1]]?'done':''}" data-a="addf" data-n="${x[1]}">${st.sent[x[1]]?'Запрос отправлен':'Добавить'}</button></div>`).join('')}</div>
 <div class="sp"></div>${btn('Искать новых друзей','near','g')}`},

near:()=>{const l=PETS.filter(p=>p.z===st.district&&(!st.nmetro||p.m===st.nmetro)).map(p=>({p,s:Math.min(97,pet(p))})).sort((a,b)=>b.s-a.s);
 return `${back('choose')}<h1>Рядом</h1>
 <div class="row"><label class="f" style="flex:1">Район<select id="nd">${dopts()}</select></label><label class="f" style="flex:1">Метро<select id="nmt">${(()=>{return `<option value="">Любое метро</option>`+(METRO[st.district]||[]).map(m=>`<option ${m===st.nmetro?'selected':''}>${m}</option>`).join('')})()}</select></label></div>
 ${l.length?`<div id="nl" style="display:grid;gap:10px">${l.map(({p,s})=>`<div class="card ${s>=80?'hl':''}"><div class="av">${p.e}</div><div class="t"><b>${p.n} <span class="pct">${s}%</span></b><small>${s>=80?'Подходит · ':''}${p.e2.toLowerCase()}, ${p.d.toLowerCase()}<br>${p.s} · м. ${p.m}</small></div><button class="mini ${st.sent[p.n]?'done':''}" data-a="walk" data-n="${p.n}">${st.sent[p.n]?'Приглашён':'Позвать гулять'}</button></div>`).join('')}</div>
 <div class="tip">Встречайтесь в людных местах, лучше днём</div><div class="mu">⋯ В карточке питомца можно нажать «Заблокировать»</div>`
 :`<div class="sp"></div><div class="big2">🌳</div><h2 style="text-align:center">Пока никого рядом</h2><p class="mu" style="text-align:center">${st.nmetro?`У метро «${st.nmetro}» пока нет анкет. Покажите весь район или пригласите знакомых.`:`В районе «${st.district}» пока нет анкет. Мы сообщим, когда появятся подходящие питомцы.`}</p>`}
 <div class="sp"></div>${l.length?'':st.nmetro?btn('Показать весь район','anym'):btn('Пригласить знакомых','invite')}${btn('Мои друзья','friends','g')}`},

done:()=>`<div class="sp"></div><div class="big2">🐾</div><h1 style="text-align:center">Приглашение отправлено</h1><p class="mu" style="text-align:center">Владелец получит уведомление. Ответ придёт push-сообщением, а ваш профиль уже виден другим владельцам района.</p><div class="sp"></div>${btn('Смотреть других питомцев','near')}${btn('Скрыть мой профиль из поиска','hide','g')}`,

err:()=>`<div class="sp"></div><div class="big2">🐾</div><h1 style="text-align:center">Что-то пошло не так</h1><p class="mu" style="text-align:center">Не удалось загрузить данные. Попробуйте ещё раз или обратитесь в поддержку.</p><div class="sp"></div>${btn('Повторить','promo')}${btn('В поддержку','support','g')}`
};

function bind(){
 document.querySelectorAll('#scr [data-a]').forEach(e=>e.onclick=()=>act(e.dataset.a,e));
 const ok=$('#ok');if(ok){const up=()=>$('#rb').disabled=!ok.checked;ok.onchange=up;if(st.ok)ok.checked=true;up();$('#ph').oninput=e=>st.phone=e.target.value}
 document.querySelectorAll('.chips[data-k]').forEach(c=>c.onclick=e=>{const b=e.target.closest('.ch');if(!b)return;
  const k=c.dataset.k,v=b.textContent;st.ans[k]=[v];
  c.querySelectorAll('.ch').forEach(x=>x.classList.toggle('on',x===b));
  c.classList.remove('bad');const qe=$('#qe');if(qe)qe.textContent='';
  if(v===OTHER&&k==st.q){const t=$('#nt');t.style.display='';$('.more').textContent='− Скрыть';t.placeholder='Опишите своими словами';t.focus();if(st.note[st.q]===undefined)st.note[st.q]=''}});
 const sq=$('#sq');if(sq)sq.oninput=()=>{const v=sq.value.trim().toLowerCase().replace('@','');
  const f=!v||['luna_walks','rex_park','луна','рекс'].some(x=>x.includes(v));
  $('#se').textContent=f?'':'Ник не найден. Проверьте написание.';$('#fl').style.display=f?'':'none'};
 const ds=$('#ds');if(ds)ds.onchange=()=>{st.district=ds.value;st.metro='';$('#mt').innerHTML=mopts(ds.value,'Не указывать')};
 const nd=$('#nd');if(nd)nd.onchange=()=>{st.district=nd.value;st.nmetro='';go('near')};
 const nm=$('#nmt');if(nm)nm.onchange=()=>{st.nmetro=nm.value;go('near')};
}
function act(a,e){
 const m={tryit:()=>go(st.registered?'profile':'reg'),think:()=>go('think'),promo:()=>go('promo'),rules:()=>{st.ok=$('#ok').checked;go('rules')},
 acceptrules:()=>{st.ok=true;go('reg')},
 sendcode:()=>{const d=$('#ph').value.replace(/\D/g,'');st.phone=$('#ph').value;
  if(d.length<11){$('#fp').classList.add('bad');$('#re').textContent='Введите номер полностью, например +7 900 123-45-67.';return}
  $('#fp').classList.remove('bad');st.code=String(1000+Math.floor(Math.random()*9000));$('#cd').disabled=false;$('#cd').focus();$('#re').textContent='';
  e.textContent='Отправить код ещё раз';toast('SMS: ваш код '+st.code+'. В прототипе код показан на экране, настоящее SMS не отправляется.',6000)},
 doreg:()=>{if(!st.code){$('#re').textContent='Сначала нажмите «Получить код».';return}
  if($('#cd').value!==st.code){$('#fc').classList.add('bad');$('#re').textContent='Код не подошёл. Проверьте цифры или запросите новый.';return}st.registered=true;go('profile')},
 startquiz:()=>{st.district=$('#ds').value;st.metro=$('#mt').value;st.nmetro=st.metro;st.name=$('#nm').value.trim()||'Бублик';
  const br=$('#br').value.toLowerCase(),k=Object.keys(BREEDS).find(x=>br.includes(x));st.auto='';
  if(k&&!st.ans[0]){st.ans[0]=[SIZE[BREEDS[k][0]]];st.ans['0b']=[BODY[BREEDS[k][1]]];st.auto=$('#br').value.trim()}
  st.q=0;go('quiz')},
 qback:()=>{save();if(st.q>0){st.q--;go('quiz')}else go('profile')},
 more:()=>{const t=$('#nt');const o=t.style.display==='none';t.style.display=o?'':'none';e.textContent=o?'− Скрыть':'+ Написать подробнее';if(o){t.focus();st.note[st.q]=t.value}else{t.value='';delete st.note[st.q]}},
 qnext:()=>{save();const q=Q[st.q],i=st.q;
  if(!q.free){const a=st.ans[i]||[],b=st.ans[i+'b']||[];let msg='';
   if(!a.length){$('#g1').firstChild.classList.add('bad');msg='Выберите вариант, чтобы продолжить.'}
   else if(q.o2&&!b.length){$('#g2').firstChild.classList.add('bad');msg='Выберите вариант, чтобы продолжить.'}
   else if(a[0]===OTHER&&!(st.note[i]||'').trim()){const t=$('#nt');t.style.display='';t.focus();t.parentNode.querySelector('.more').textContent='− Скрыть';msg='Опишите ответ своими словами в поле ниже.'}
   if(msg){$('#qe').textContent=msg;return}}
  if(i<Q.length-1){st.q++;go('quiz')}else{toast('Анкета сохранена');go('choose')}},
 friends:()=>go('friends'),near:()=>go('near'),choose:()=>go('choose'),
 addf:()=>{st.sent[e.dataset.n]=1;e.textContent='Запрос отправлен';e.classList.add('done');toast('Запрос отправлен: '+e.dataset.n)},
 walk:()=>{st.sent[e.dataset.n]=1;go('done')},anym:()=>{st.nmetro='';go('near')},
 invite:()=>toast('Ссылка-приглашение скопирована'),hide:()=>toast('Профиль скрыт из поиска. Вернуть его можно в настройках'),
 support:()=>toast('Чат с поддержкой откроется в приложении')};
 m[a]&&m[a]()}
function save(){const t=$('#nt');if(!t)return;const q=Q[st.q];if(q.free)st.note.free=t.value;else if(t.style.display!=='none')st.note[st.q]=t.value;else delete st.note[st.q]}

$('#steps').innerHTML=NAV.map(x=>`<li><button data-id="${x[0]}">${x[1]}</button></li>`).join('');
document.querySelectorAll('#steps button').forEach(b=>b.onclick=()=>{const id=b.dataset.id;if(id==='quiz')st.q=0;go(id)});
$('#mb').onclick=()=>document.body.classList.toggle('menu');
go('promo');
</script>
</body>
</html>
